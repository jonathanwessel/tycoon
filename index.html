<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copper Gulch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: an app shell. Phones: header, pinned map with controls, scrolling sheet, bottom tab bar. Wide screens: map on the left, tabs and sheet on the right. */
:root {
  color-scheme: dark;
  --bg: #161a2a;        /* night sky over the gulch */
  --panel: #1f2539;
  --panel-2: #29304c;
  --line: #3a4369;
  --fg: #ece6d8;        /* lamp-lit paper */
  --muted: #9da3bd;
  --copper: #e38d4e;    /* accent */
  --copper-ink: #20130a;
  --teal: #56d3c6;      /* crystal */
  --gold: #f2d04a;
  --good: #7fd992;
  --bad: #f07067;
  --display: "Rye", "Rockwell", Georgia, serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.35;
  font-variant-numeric: tabular-nums;
  padding-block: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
button, canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { -webkit-user-select: none; user-select: none; transition: background-color .18s, border-color .18s, color .18s, box-shadow .25s, opacity .18s, transform .08s; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; width: 20px; height: 20px; flex: none; vertical-align: middle; }
.app {
  height: 100%; max-width: 1200px; margin: 0 auto; padding-top: 6px;
  display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "stage" "sheet" "nav";
}
header { grid-area: head; display: flex; align-items: center; gap: 4px 10px; min-width: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; margin: 0; color: var(--copper); letter-spacing: .02em; white-space: nowrap; }
.hud { display: flex; gap: 10px; margin-left: auto; font-weight: 600; align-items: center; }
.hud > span { display: inline-flex; align-items: center; gap: 3px; }
.hud img.px { width: 18px; height: 18px; }
.hud b { color: var(--copper); font-size: 1.05em; }
.hud .lbl { display: none; color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.stage { grid-area: stage; display: grid; gap: 6px; min-width: 0; align-content: start; }
.mapwrap { position: relative; width: min(100%, calc(46vh * 12 / 14)); width: min(100%, calc(46dvh * 12 / 14)); aspect-ratio: 12 / 14; margin: 0 auto; max-width: 100%; }
canvas#cv {
  width: 100%; height: 100%; display: block; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; background: #c9a26c;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.toast {
  position: absolute; left: 8px; right: 8px; top: 8px; pointer-events: none; text-align: center;
  background: rgba(22, 26, 42, .9); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px;
  font-weight: 600; font-size: .9rem; line-height: 1.25; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: none; }
.mapbtn { position: absolute; left: 8px; bottom: 8px; width: 38px; height: 38px; min-height: 38px; padding: 0; display: grid; place-items: center; background: rgba(22, 26, 42, .78); border-color: rgba(236, 230, 216, .25); }
.mapbtn .ic { width: 12px; height: 14px; display: block; background: linear-gradient(90deg, currentColor 0 34%, transparent 34% 66%, currentColor 66%); }
.pausecover { position: absolute; inset: 0; border-radius: 8px; border: 0; background: rgba(14, 16, 30, .62); display: grid; place-content: center; gap: 6px; text-align: center; animation: fadein .2s ease-out; -webkit-backdrop-filter: saturate(.6); backdrop-filter: saturate(.6); }
.pausecover:hover:not(:disabled) { border-color: transparent; }
.pausecover:focus-visible { outline-offset: -4px; }
.pausecover b { font-family: var(--display); font-weight: 400; font-size: 2.2rem; color: var(--copper); }
.pausecover span { color: var(--fg); font-weight: 600; }
.pausecover b::before { content: ''; display: block; width: 0; height: 0; margin: 0 auto 10px; border-style: solid; border-width: 18px 0 18px 30px; border-color: transparent transparent transparent var(--copper); }
.controls { display: flex; gap: 6px; align-items: stretch; }
.controls #bWave { flex: 1; min-width: 0; min-height: 44px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls #bSpeed { width: 48px; padding: 0; }
#bWave { --p: 0%; background-image: linear-gradient(90deg, rgba(255, 255, 255, .18) var(--p), transparent var(--p)); }
#bWave.soon { animation: soon 1s ease-in-out infinite; }
@keyframes soon { 50% { box-shadow: 0 0 0 3px rgba(242, 208, 74, .55), 0 0 16px rgba(242, 208, 74, .55); } }
#bWave.live { background-color: #5b2c2c; border-color: var(--bad); color: var(--fg); }
#bWave.live:disabled { opacity: 1; }
#bWave.held { background-color: var(--panel-2); border-color: var(--copper); color: var(--copper); }
#bHold { width: 48px; padding: 0; display: grid; place-items: center; align-content: center; gap: 3px; font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#bHold .ic { width: 12px; height: 14px; display: block; background: linear-gradient(90deg, currentColor 0 34%, transparent 34% 66%, currentColor 66%); }
#bHold.held { background: #3d3522; border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(242, 208, 74, .35); }
.ab { position: relative; width: 48px; min-height: 44px; padding: 0; display: grid; place-items: center; overflow: hidden; }
.ab img.px { width: 28px; height: 28px; }
.ab .cd { position: absolute; inset: 0; background: rgba(15, 18, 30, .72); transform-origin: bottom; transform: scaleY(0); }
.ab .cdn { position: absolute; font-size: .85rem; color: var(--fg); }
.ab.ready { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(242, 208, 74, .35); }
.ab.active { background: #4a3f22; }
.stock { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.stock::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-width: 84px; background: var(--panel); border-radius: 5px; padding: 4px 6px; display: flex; align-items: center; gap: 5px; }
.chip img.px { width: 24px; height: 24px; }
.chip .v { font-weight: 700; line-height: 1.1; }
.chip .r { font-size: .7rem; color: var(--muted); line-height: 1.1; white-space: nowrap; }
.chip .r.up { color: var(--good); } .chip .r.down { color: var(--bad); }
.sheet { grid-area: sheet; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
nav.tabs { grid-area: nav; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-bottom: 6px; }
nav.tabs button { position: relative; display: grid; justify-items: center; align-content: center; gap: 1px; padding: 4px 2px; min-height: 52px; font-size: .78rem; }
nav.tabs img.px { width: 24px; height: 24px; }
nav.tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--copper); color: var(--copper); }
nav .dot { position: absolute; top: 5px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--bg); }
@media (min-width: 900px) {
  body { padding-bottom: 12px; }
  .app { grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "head head" "stage nav" "stage sheet"; column-gap: 14px; padding-top: 12px; }
  h1 { font-size: 1.6rem; }
  .hud { gap: 16px; } .hud .lbl { display: inline; } .hud img.px { width: 20px; height: 20px; }
  .mapwrap { width: min(100%, calc((100vh - 170px) * 12 / 14)); width: min(100%, calc((100dvh - 170px) * 12 / 14)); }
  .stock { flex-wrap: wrap; }
  nav.tabs { padding-bottom: 0; }
  nav.tabs button { grid-auto-flow: column; gap: 6px; min-height: 42px; font-size: .95rem; }
  nav.tabs img.px { width: 20px; height: 20px; }
  nav .dot { top: -4px; right: -4px; }
}
button {
  font: inherit; font-weight: 600; color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; min-height: 40px;
}
button:hover:not(:disabled) { border-color: var(--copper); }
button:active:not(:disabled) { transform: translateY(1px) scale(.97); }
button.primary:hover:not(:disabled) { box-shadow: 0 0 0 1px rgba(255, 255, 255, .15) inset, 0 4px 14px rgba(227, 141, 78, .3); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--copper); color: var(--copper-ink); border-color: var(--copper); }
button.on { border-color: var(--teal); color: var(--teal); }
button.small { padding: 4px 10px; min-height: 36px; font-size: .9rem; }
button.danger { border-color: var(--bad); color: var(--bad); }
button.x { width: 36px; padding: 0; flex: none; }
.grow1 { flex: 1; }
.cost { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-weight: 600; font-size: .9rem; }
.cost > span { display: inline-flex; align-items: center; gap: 2px; }
.cost img.px { width: 16px; height: 16px; }
.cost .short { color: var(--bad); }
button.primary .cost .short { color: #7a1010; }
.recipe { display: inline-flex; align-items: center; gap: 1px; margin-right: 6px; flex-wrap: wrap; }
.recipe img.px { width: 18px; height: 18px; }
.recipe .arrow { color: var(--muted); margin: 0 3px; }
.goal { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.goal.done { border-color: var(--gold); background: #353024; }
.goal img.px { width: 28px; height: 28px; }
.goal .grow { flex: 1; min-width: 0; display: grid; gap: 4px; }
.goal .gt { font-weight: 600; }
.goal .gt small { margin-left: 6px; }
.goal .bar { flex-wrap: nowrap; }
.name { font-weight: 600; }
.name i { font-style: normal; color: var(--teal); font-weight: 500; margin-left: 4px; }
.name em { font-style: normal; color: var(--gold); font-weight: 600; margin-left: 4px; letter-spacing: .05em; }
small { color: var(--muted); font-weight: 500; font-size: .82rem; }
.card { background: var(--panel); border: 1px solid var(--copper); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.card .row { border: 0; padding: 0; }
.cardhead { display: flex; align-items: center; gap: 8px; }
.cardhead > img.px { width: 34px; height: 34px; }
.cardhead .grow { flex: 1; min-width: 0; display: grid; }
.buildopt { display: flex; align-items: center; gap: 8px; text-align: left; width: 100%; min-height: 54px; }
.buildopt > img.px { width: 34px; height: 34px; }
.buildopt .grow { flex: 1; min-width: 0; display: grid; gap: 1px; }
.buildopt .cost { justify-content: flex-end; max-width: 42%; }
.branches { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.branches button { display: grid; gap: 3px; text-align: left; align-content: start; }
.branches small { line-height: 1.25; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.seg small { margin-right: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.next { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; font-weight: 600; }
.next span { display: inline-flex; align-items: center; gap: 2px; }
.next img.px { width: 26px; height: 26px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 0; }
h2:first-child { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
h2 + .row, p + .row { border-top: 0; padding-top: 0; }
.row .grow { flex: 1 1 160px; min-width: 0; }
.row .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.row > img.px { width: 34px; height: 34px; }
.row button { flex: none; }
.row.bld { flex-wrap: nowrap; }
.row.bld .grow { flex: 1 1 0; }
.row.bld .acts { flex: none; flex-direction: column; flex-wrap: nowrap; align-items: flex-end; gap: 4px; }
.row.bld .mini { display: flex; gap: 4px; }
.row.bld .mini button { min-height: 34px; padding: 2px 8px; }
button.fm { display: inline-flex; align-items: center; gap: 4px; }
button.fm > img.px { width: 22px; height: 22px; }
button.fm .cost img.px { width: 14px; height: 14px; }
button.sw { min-width: 44px; }
.prog { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--copper); }
.prog.idle i { background: var(--line); }
.goal .prog { height: 6px; margin: 0; }
.goal .prog i { background: var(--gold); }
canvas.spark { width: 64px; height: 24px; flex: none; }
.taps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.taps button { min-height: 52px; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.taps img.px { width: 30px; height: 30px; }
p { margin: 0; color: var(--muted); max-width: 60ch; }
p strong { color: var(--fg); }
.deeds { display: flex; align-items: baseline; gap: 8px; }
.deeds b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; color: var(--gold); }
textarea { width: 100%; min-height: 64px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: .8rem ui-monospace, monospace; padding: 6px; }
img.fly { position: fixed; width: 22px; height: 22px; z-index: 50; pointer-events: none; image-rendering: pixelated; }
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(10, 12, 22, .72); }
.modal .box { width: min(100%, 360px); background: var(--panel); border: 1px solid var(--copper); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.modal h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; color: var(--copper); }
.away { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.away div { display: flex; align-items: center; gap: 4px; font-weight: 700; min-width: 0; }
.away img.px { width: 24px; height: 24px; }
@media (max-width: 420px) { .branches { grid-template-columns: 1fr; } }
.modal { animation: fadein .22s ease-out; }
.modal .box { animation: popin .34s cubic-bezier(.2, 1.3, .4, 1); box-shadow: 0 18px 50px rgba(0, 0, 0, .5); }
@keyframes fadein { from { opacity: 0; } }
@keyframes popin { from { opacity: 0; transform: translateY(14px) scale(.94); } }
.goal { transition: border-color .3s, background-color .3s; }
.goal.done { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 2px rgba(242, 208, 74, .35), 0 0 18px rgba(242, 208, 74, .25); } }
.prog i { transition: width .25s ease-out; }
nav .dot { animation: dotpop .3s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes dotpop { from { transform: scale(0); } }
@media (prefers-reduced-motion: reduce) { .toast, button, .prog i { transition: none; } .modal, .modal .box, .goal.done, #bWave.soon, nav .dot { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Copper Gulch</h1>
    <div class="hud">
      <span id="hCoinWrap"><img class="px" id="hCoinIcon" alt=""><span class="lbl">Coins</span><b id="hCoins">0</b></span>
      <span title="Wave"><img class="px" id="hWaveIcon" alt="Wave"><span class="lbl">Wave</span><b id="hWave">1</b></span>
      <span title="Vault strength"><img class="px" id="hVaultIcon" alt="Vault"><span class="lbl">Vault</span><b id="hVault">20</b></span>
      <span id="hDeedsWrap" title="Deeds" hidden><img class="px" id="hDeedIcon" alt="Deeds"><span class="lbl">Deeds</span><b id="hDeeds">0</b></span>
    </div>
  </header>
  <section class="stage" aria-label="The gulch">
    <div class="mapwrap">
      <canvas id="cv" aria-label="Map of the gulch. Hold trees and rocks to gather, tap a building to upgrade it, tap an empty plot by the road to build a tower."></canvas>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <button class="mapbtn" id="bPause" aria-label="Pause the game" title="Pause (P)"><i class="ic" aria-hidden="true"></i></button>
      <button class="pausecover" id="pauseCover" hidden><b>Paused</b><span>Tap to carry on</span></button>
    </div>
    <div class="controls">
      <button id="bWave" class="primary">Call wave</button>
      <button id="bHold" aria-pressed="false" title="Hold waves: raiders only come when you call them"><i class="ic" aria-hidden="true"></i><span>Hold</span></button>
      <button class="ab" id="ab-dyn"></button>
      <button class="ab" id="ab-ot"></button>
      <button id="bSpeed">1×</button>
    </div>
    <div class="stock" id="stock"></div>
  </section>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main class="sheet" id="sheet">
    <div class="card" id="card" hidden></div>
    <div class="panel" id="panel" role="tabpanel"></div>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<script>
'use strict';
/* =========================================================
   Definitions
   ========================================================= */
const ITEMS = {
  wood:    { n: 'Timber',     p: 1 },
  ore:     { n: 'Ore',        p: 1 },
  crystal: { n: 'Crystal',    p: 4 },
  coal:    { n: 'Coal',       p: 3 },
  plank:   { n: 'Planks',     p: 5 },
  ingot:   { n: 'Ingots',     p: 6 },
  lens:    { n: 'Lenses',     p: 20 },
  gear:    { n: 'Gears',      p: 22 },
  engine:  { n: 'Engines',    p: 150 },
  steel:   { n: 'Steel',      p: 40 },
  clock:   { n: 'Clockwork',  p: 110 },
  auto:    { n: 'Automatons', p: 1400 },
};
const EXT = [
  { id: 'camp',  n: 'Lumber Camp',   out: 'wood',    rate: .5, cost: 15 },
  { id: 'mine',  n: 'Ore Mine',      out: 'ore',     rate: .5, cost: 15 },
  { id: 'drill', n: 'Crystal Drill', out: 'crystal', rate: .3, cost: 400 },
  { id: 'pit',   n: 'Coal Pit',      out: 'coal',    rate: .4, cost: 2500 },
];
const SHOPS = [
  { id: 'saw',    n: 'Sawmill',         in: { wood: 2 },                        out: 'plank',  rate: .25, cost: 50 },
  { id: 'smelt',  n: 'Smelter',         in: { ore: 2 },                         out: 'ingot',  rate: .25, cost: 60 },
  { id: 'glass',  n: 'Glassworks',      in: { crystal: 2 },                     out: 'lens',   rate: .15, cost: 800 },
  { id: 'mach',   n: 'Machine Shop',    in: { plank: 1, ingot: 1 },             out: 'gear',   rate: .15, cost: 500 },
  { id: 'eng',    n: 'Engine Works',    in: { gear: 2, lens: 1 },               out: 'engine', rate: .05, cost: 5000 },
  { id: 'mill',   n: 'Steel Mill',      in: { ingot: 1, coal: 2 },              out: 'steel',  rate: .12, cost: 9000 },
  { id: 'clockw', n: 'Clockworks',      in: { gear: 1, lens: 1 },               out: 'clock',  rate: .08, cost: 20000 },
  { id: 'autow',  n: 'Automaton Works', in: { engine: 1, clock: 1, steel: 2 },  out: 'auto',   rate: .03, cost: 120000 },
];
const RESEARCH = [
  { id: 'tools',  n: 'Sharper Tools',    d: 'Doubles what each tap gathers.',            cost: 40,  g: 3,   max: 12 },
  { id: 'ledger', n: 'Trading Ledger',   d: 'Unlocks auto-sell switches in the Market.',  cost: 250, g: 1,   max: 1 },
  { id: 'steam',  n: 'Steam Power',      d: '+25% camp, mine, drill and pit output.',    cost: 200, g: 1.8, max: 99 },
  { id: 'lines',  n: 'Assembly Lines',   d: '+25% workshop speed.',                      cost: 300, g: 1.8, max: 99 },
  { id: 'haggle', n: 'Haggling',         d: '+10% sale prices.',                         cost: 500, g: 2,   max: 99 },
  { id: 'guns',   n: 'Gunsmithing',      d: '+15% tower damage, compounding.',           cost: 400, g: 2.2, max: 99 },
  { id: 'bounty', n: 'Bounty Posters',   d: '+20% coins from raiders.',                  cost: 600, g: 2,   max: 99 },
  { id: 'vault',  n: 'Reinforced Vault', d: '+5 vault strength.',                        cost: 300, g: 2,   max: 20 },
];
const TOWERS = {
  crossbow: { n: 'Crossbow',   coins: 25,   goods: { plank: 5 },             dmg: 4,  rate: 1.25, range: 2.4, d: 'Quick single shots.' },
  cannon:   { n: 'Cannon',     coins: 120,  goods: { ingot: 12 },            dmg: 24, rate: .5,   range: 2.8, splash: 1.1, d: 'Slow, hits a cluster, smashes shields.' },
  frost:    { n: 'Frost Lens', coins: 300,  goods: { lens: 8 },              dmg: 5,  rate: 1,    range: 2.1, slow: 2, d: 'Chills everything in reach.' },
  tesla:    { n: 'Tesla Coil', coins: 1500, goods: { gear: 10, engine: 2 },  dmg: 90, rate: .8,   range: 2.6, chain: 3, d: 'Lightning jumps between raiders.' },
  gatling:  { n: 'Gatling',    coins: 3000, goods: { steel: 10, clock: 4 },  dmg: 60, rate: 6,    range: 2.6, d: 'A hail of bullets.' },

/* =========================================================
   State and saving
   ========================================================= */
function fresh() {
  const res = {}; for (const k in ITEMS) res[k] = 0; res.plank = 10;
  return {
    v: 2, coins: 60, life: 0, res, seen: { wood: 1, ore: 1, plank: 1 }, ext: {}, shops: {}, off: {}, auto: {}, research: {}, towers: [],
    wave: 1, best: 1, vaultHp: 20, deeds: 0, perks: {}, charters: 0, map: 'gulch', maps: { gulch: 1 },
    contracts: [], demand: {}, sellAbove: 0, mgr: {}, goal: 0, gq: null, goalsDone: 0,
    stats: { sold: 0, soldV: 0, kills: 0, contracts: 0, taps: 0 }, cd: { dyn: 0, ot: 0 }, ot: 0,
    autoWave: true, speed: 1, sound: false, last: Date.now(),
  };
}
let S = fresh();
const KEY = 'copper-gulch-save-v1';
function save() { S.last = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { const t = localStorage.getItem(KEY); if (t) adopt(JSON.parse(t)); } catch (e) {} }
function adopt(o) {
  if (!o || typeof o !== 'object' || !o.res) return false;
  if (!o.v) { (o.towers || []).forEach(t => { t.r += 2; }); o.v = 2; } // v1 maps had a two-row yard
  const f = fresh(); S = Object.assign(f, o);
  for (const k of ['res', 'seen', 'ext', 'shops', 'off', 'auto', 'research', 'perks', 'maps', 'demand', 'mgr', 'stats', 'cd']) S[k] = Object.assign(fresh()[k], o[k]);
  setMap(S.map);
  S.towers = (S.towers || []).filter(t => TOWERS[t.type] && t.r >= YARD && t.r < ROWS && t.c >= 0 && t.c < COLS && !onRoad(t.c, t.r));
  return true;
}

/* =========================================================
   Maths
   ========================================================= */
const lv = id => S.research[id] || 0;
const perk = id => S.perks[id] || 0;
const deedMult = () => 1 + .2 * S.deeds;
const prodMult = () => (1 + .25 * lv('steam')) * deedMult();
const craftMult = () => (1 + .25 * lv('lines')) * (1 + .25 * perk('teams')) * deedMult();
const sellMult = () => 1 + .1 * lv('haggle');
const dmgMult = () => Math.pow(1.15, lv('guns')) * deedMult();
const tapYield = () => Math.pow(2, lv('tools'));
const vaultMax = () => 20 + 5 * lv('vault');
/* Milestones: output doubles at levels 10, 25, 50, then every 100. */
const MS = l => (l >= 10) + (l >= 25) + (l >= 50) + (l >= 100 ? Math.floor(l / 100) : 0);
const nextMs = l => l < 10 ? 10 : l < 25 ? 25 : l < 50 ? 50 : (Math.floor(l / 100) + 1) * 100;
const blv = id => S[BY_ID[id].kind][id] || 0;
const bMult = id => Math.pow(2, MS(blv(id)));
const bCost = (b, have) => Math.ceil(b.def.cost * Math.pow(b.g, have));
/* Market: selling pushes a price down; it drifts back up over time. */
const dem = k => S.demand[k] === undefined ? 1 : S.demand[k];
function outRate(k) {
  let r = 0;
  for (const e of EXT) if (e.out === k) r += blv(e.id) * e.rate * prodMult() * bMult(e.id);
  for (const s of SHOPS) if (s.out === k) r += blv(s.id) * s.rate * craftMult() * bMult(s.id);
  return r;
}
const depth = k => 60 + 120 * outRate(k);
const price = k => ITEMS[k].p * sellMult() * dem(k);
const sellValue = (k, n) => { const dp = depth(k); return ITEMS[k].p * sellMult() * dem(k) * dp * (1 - Math.exp(-n / dp)); };
function sell(k, n) {
  n = Math.min(n, S.res[k]); if (!(n > 0)) return 0;
  const v = sellValue(k, n); S.demand[k] = Math.max(.3, dem(k) * Math.exp(-n / depth(k)));
  S.res[k] -= n; earn(v); S.stats.sold += n; S.stats.soldV += v; return v;
}
function fmt(n) {
  if (n < 1000) return String(Math.floor(n));
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n >= 1000 ? n.toExponential(2) : (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : Math.floor(n)) + u[i];
}
const rate = n => n < 10 ? (Math.round(n * 100) / 100).toString() : fmt(n);
const pct = n => Math.round(n * 100) + '%';
function earn(c) { S.coins += c; S.life += c; }
function add(k, n) { S.res[k] += n; if (!S.seen[k] && S.res[k] > 0) { S.seen[k] = 1; rebuild = true; } }
function goodsText(g) { return Object.keys(g).map(k => g[k] + ' ' + ITEMS[k].n.toLowerCase()).join(' + '); }
function hasGoods(g) { for (const k in g) if (S.res[k] < g[k]) return false; return true; }

/* =========================================================
   Sound (off until switched on)
   ========================================================= */
let AC = null; const lastSnd = {};
function snd(name, f, d = .07, type = 'square', v = .04, slide = 0) {
  if (!S.sound) return; const now = performance.now(); if (now - (lastSnd[name] || 0) < 70) return; lastSnd[name] = now;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* =========================================================
   Economy
   ========================================================= */
const ACT = {}, STARVE = {}, PHASE = {};
function econStep(dt) {
  const ot = S.ot > 0 ? 3 : 1, pm = prodMult() * ot, cm = craftMult() * ot, ease = Math.min(1, dt * 3);
  S.ot = Math.max(0, S.ot - dt); for (const k in S.cd) S.cd[k] = Math.max(0, S.cd[k] - dt);
  for (const e of EXT) { const l = S.ext[e.id] || 0; if (l) add(e.out, l * e.rate * pm * bMult(e.id) * dt); }
  for (const s of SHOPS) {
    const l = S.shops[s.id] || 0; if (!l) continue;
