<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copper Gulch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: the gulch map is the stage (town yard on top, raid road below); the ledger sits beside it on wide screens and below it on phones. */
:root {
  color-scheme: dark;
  --bg: #161a2a;        /* night sky over the gulch */
  --panel: #1f2539;
  --panel-2: #29304c;
  --line: #3a4369;
  --fg: #ece6d8;        /* lamp-lit paper */
  --muted: #9da3bd;
  --copper: #e38d4e;    /* accent */
  --copper-ink: #20130a;
  --teal: #56d3c6;      /* crystal */
  --good: #7fd992;
  --bad: #f07067;
  --display: "Rye", "Rockwell", Georgia, serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.35;
  font-variant-numeric: tabular-nums;
  padding-block: 12px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
img.px { image-rendering: pixelated; image-rendering: crisp-edges; width: 20px; height: 20px; flex: none; vertical-align: middle; }
.app { max-width: 1160px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0; color: var(--copper); letter-spacing: .02em; }
.hud { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-left: auto; font-weight: 600; align-items: center; }
.hud > span { display: inline-flex; align-items: center; gap: 5px; }
.hud b { color: var(--copper); font-size: 1.2em; }
.hud .lbl { color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.cols { display: grid; gap: 12px; min-width: 0; }
@media (min-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr) 440px; align-items: start; } }
.stage, .ledger { display: grid; gap: 8px; min-width: 0; }
canvas { width: 100%; aspect-ratio: 1 / 1; display: block; border-radius: 6px; border: 1px solid var(--line); touch-action: manipulation; cursor: pointer; background: #c9a26c; image-rendering: pixelated; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.next { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: .9rem; font-weight: 600; flex-wrap: wrap; }
.next img.px { width: 22px; height: 22px; margin-left: 5px; }
.log { min-height: 1.4em; color: var(--muted); font-size: .92rem; }
.log.flash { color: var(--fg); }

button {
  font: inherit; font-weight: 600; color: var(--fg); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; cursor: pointer; min-height: 36px;
}
button:hover:not(:disabled) { border-color: var(--copper); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--copper); color: var(--copper-ink); border-color: var(--copper); }
button.on { border-color: var(--teal); color: var(--teal); }
button.small { padding: 4px 8px; min-height: 30px; font-size: .9rem; }
button.danger { border-color: var(--bad); color: var(--bad); }

.cost { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 7px; font-weight: 600; font-size: .9rem; }
.cost > span { display: inline-flex; align-items: center; gap: 2px; }
.cost img.px { width: 16px; height: 16px; }
.cost .short { color: var(--bad); }
button.primary .cost .short { color: #7a1010; }
.recipe { display: inline-flex; align-items: center; gap: 1px; margin-right: 6px; }
.recipe img.px { width: 18px; height: 18px; }
.recipe .arrow { color: var(--muted); margin: 0 3px; }

.palette { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.palette button { display: grid; gap: 3px; text-align: left; padding: 6px 8px; line-height: 1.2; align-content: start; }
.palette button.sel { border-color: var(--copper); background: #3a2f33; }
.palette .tn { display: flex; align-items: center; gap: 6px; }
.palette .tn img.px { width: 30px; height: 30px; }
small { color: var(--muted); font-weight: 500; font-size: .82rem; }
.card { background: var(--panel); border: 1px solid var(--copper); border-radius: 6px; padding: 8px 10px; }
.card .row { border: 0; padding: 0; }

.stock { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.chip { background: var(--panel); border-radius: 5px; padding: 5px 6px; display: flex; align-items: center; gap: 6px; min-width: 0; }
.chip img.px { width: 26px; height: 26px; }
.chip .v { font-weight: 700; line-height: 1.1; }
.chip .r { font-size: .72rem; color: var(--muted); line-height: 1.1; min-height: 1.1em; }
.chip .r.up { color: var(--good); } .chip .r.down { color: var(--bad); }
.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.tabs button[aria-selected="true"] { background: var(--panel); border-color: var(--copper); color: var(--copper); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; }
h2 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 6px 0 0; }
h2:first-child { margin-top: 0; }
.row { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
h2 + .row { border-top: 0; padding-top: 0; }
.row .grow { flex: 1; min-width: 0; }
.row > img.px { width: 34px; height: 34px; }
.row .name { font-weight: 600; }
.row .name i { font-style: normal; color: var(--teal); font-weight: 500; margin-left: 4px; }
.row button { flex: none; }
.prog { height: 4px; background: var(--bg); border-radius: 2px; margin-top: 4px; overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--copper); }
.prog.idle i { background: var(--line); }
.taps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.taps button { min-height: 52px; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
.taps img.px { width: 30px; height: 30px; }
p { margin: 0; color: var(--muted); max-width: 60ch; }
p strong { color: var(--fg); }
textarea { width: 100%; min-height: 64px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; font: .8rem ui-monospace, monospace; padding: 6px; }
img.fly { position: fixed; width: 22px; height: 22px; z-index: 50; pointer-events: none; image-rendering: pixelated; }
@media (max-width: 420px) { .palette { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Copper Gulch</h1>
    <div class="hud">
      <span id="hCoinWrap"><img class="px" id="hCoinIcon" alt=""><span class="lbl">Coins</span><b id="hCoins">0</b></span>
      <span><span class="lbl">Wave</span><b id="hWave">1</b></span>
      <span><span class="lbl">Vault</span><b id="hVault">20</b></span>
      <span id="hDeedsWrap" hidden><span class="lbl">Deeds</span><b id="hDeeds">0</b></span>
    </div>
  </header>
  <div class="cols">
    <section class="stage" aria-label="The gulch">
      <canvas id="cv" aria-label="Map of the gulch. Tap trees and rocks to gather, tap a building to upgrade it, tap an empty plot by the road to build the selected tower."></canvas>
      <div class="bar">
        <button id="bWave" class="primary">Call wave</button>
        <span class="next" id="next"></span>
      </div>
      <div class="bar">
        <button id="bAuto" class="small">Auto waves</button>
        <button id="bSpeed" class="small">Speed 1×</button>
        <button id="bSound" class="small">Sound off</button>
      </div>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="card" id="card" hidden></div>
      <div class="palette" id="palette"></div>
    </section>
    <section class="ledger" aria-label="Ledger">
      <div class="stock" id="stock"></div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </section>
  </div>
</div>
<script>
'use strict';

  tesla:    { n: 'Tesla Coil', c: '#f2d04a', coins: 1500, goods: { gear: 10, engine: 2 },   dmg: 30, rate: .8,   range: 2.6, chain: 3, d: 'Lightning jumps between raiders.' },

  raider: { n: 'Bandit',    hp: 1,   spd: 1.1, rw: 1,  leak: 1, c: '#f07067', size: .72 },

  boss:   { n: 'War wagon', hp: 25,  spd: .55, rw: 20, leak: 5, c: '#ff4f8b', size: 1.25 },

const KEEP = 20, COLS = 12, ROWS = 12, OFFLINE_CAP = 8 * 3600;
/* Road waypoints are cell centres (integer = middle of a cell). Rows 0-3 are the town yard. */
const WAY = [[-.5, 5], [10, 5], [10, 7], [1, 7], [1, 10], [11, 10]], VAULT = [11, 10];

  const [x1, y1] = WAY[i], [x2, y2] = WAY[i + 1], len = Math.abs(x2 - x1) + Math.abs(y2 - y1);

  for (let t = 0; t <= len; t += .5) PATH.add(Math.round(x1 + (x2 - x1) * t / len) + ',' + Math.round(y1 + (y2 - y1) * t / len));

function posAt(d) {
  for (const s of SEG) if (d <= s.at + s.len) { const t = Math.max(0, d - s.at) / s.len; return [s.x1 + (s.x2 - s.x1) * t, s.y1 + (s.y2 - s.y1) * t]; }

/* Yard slots: top-left corner of a 2x2 block, in cells. */
const SLOT = { trees: [0, 0], camp: [2, 0], saw: [4, 0], mach: [6, 0], eng: [8, 0], market: [10, 0], rocks: [0, 2], mine: [2, 2], smelt: [4, 2], glass: [6, 2], drill: [8, 2], caravan: [10, 2] };

const maker = k => { const b = BUILD.find(b => b.def.out === k); return b && (S[b.kind][b.def.id] || 0) ? b.def.id : k === 'wood' ? 'trees' : k === 'ore' ? 'rocks' : b ? b.def.id : 'market'; };

const P = { wood: '#a8703f', woodL: '#d9a066', woodD: '#6e4526', grey: '#8f9bb0', greyL: '#c9d2de', greyD: '#5a6378', teal: '#56d3c6', tealL: '#b5f5ee', tealD: '#2f9c92', cop: '#e38d4e', copD: '#a85a2a', yel: '#f2d04a', yelL: '#fff0a0', red: '#f07067', redD: '#a83a3a', pur: '#b06be0', purD: '#6f3fa0', grn: '#5fae5a', grnD: '#36753f', grnL: '#8fd08a', blue: '#5b8be0', skin: '#f0c090', org: '#f5a04a', white: '#ece6d8', pink: '#ff4f8b', dark: '#3a2a2e', night: '#2a1c22' };
