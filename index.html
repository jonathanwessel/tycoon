<style>
/* Layout: an app shell. Phones: header, pinned map with controls, scrolling sheet, bottom tab bar. Wide screens: map on the left, tabs and sheet on the right. */
:root {
  color-scheme: dark;
  --bg: #161a2a;        /* night sky over the gulch */
  --panel: #1f2539;
  --panel-2: #29304c;
  --line: #3a4369;
  --fg: #ece6d8;        /* lamp-lit paper */
  --muted: #9da3bd;
  --copper: #e38d4e;    /* accent */
  --copper-ink: #20130a;
  --teal: #56d3c6;      /* crystal */
  --gold: #f2d04a;
  --good: #7fd992;
  --bad: #f07067;
  --display: "Rye", "Rockwell", Georgia, serif;
  --body: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; box-sizing: border-box; }
body {
  height: 100%; margin: 0; overflow: hidden;
  color: var(--fg);
  background: var(--bg);
  font-family: var(--body); font-size: 16px; line-height: 1.35;
  font-variant-numeric: tabular-nums;
  padding-block: 0;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
button, canvas { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { -webkit-user-select: none; user-select: none; transition: background-color .18s, border-color .18s, color .18s, box-shadow .25s, opacity .18s, transform .08s; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; width: 20px; height: 20px; flex: none; vertical-align: middle; }
.app {
  height: 100%; max-width: 1200px; margin: 0 auto; padding-top: 6px;
  display: grid; gap: 6px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "head" "stage" "sheet" "nav";
}
header { grid-area: head; display: flex; align-items: center; gap: 4px 10px; min-width: 0; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.2rem; margin: 0; color: var(--copper); letter-spacing: .02em; white-space: nowrap; text-shadow: 2px 2px 0 #2a1c22; }
.hud { display: flex; gap: 10px; margin-left: auto; font-weight: 600; align-items: center; }
.hud > span { display: inline-flex; align-items: center; gap: 3px; }
.hud img.px { width: 18px; height: 18px; }
.hud b { color: var(--copper); font-size: 1.05em; }
/* small phones: tighter header, and the vault shows strength without its maximum */
@media (max-width: 480px) { h1 { font-size: 1.05rem; } .hud { gap: 7px; } .hud img.px { width: 16px; height: 16px; } .hud .mx { display: none; } }
@media (max-width: 360px) { h1 { font-size: .92rem; } .hud { gap: 5px; } }
header { overflow: hidden; }
#hVaultWrap { cursor: pointer; border-radius: 6px; padding: 2px 4px; margin: -2px -4px; }
#hVaultWrap:hover { background: rgba(255, 255, 255, .06); }
#hVaultWrap:focus-visible { outline: 2px solid var(--teal); }
#hVaultWrap.low b { color: var(--bad); animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 50% { opacity: .45; } }
.prog.vbar { height: 10px; margin: 0; border-radius: 5px; }
.prog.vbar i { border-radius: 5px; }
.hud .lbl { display: none; color: var(--muted); font-weight: 500; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; }
.stage { grid-area: stage; display: grid; gap: 6px; min-width: 0; align-content: start; }
.mapwrap { position: relative; width: min(100%, calc(46vh * 12 / 14)); width: min(100%, calc(46dvh * 12 / 14)); aspect-ratio: 12 / 14; margin: 0 auto; max-width: 100%; }
canvas#cv {
  width: 100%; height: 100%; display: block; border-radius: 2px; cursor: pointer; background: #c9a26c;
  /* a plank frame around the map, drawn with hard pixel edges */
  border: 3px solid #7a4c2a; box-shadow: 0 0 0 2px #2a1c22, 4px 4px 0 2px rgba(0, 0, 0, .4);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.toast {

  font-weight: 600; font-size: .9rem; line-height: 1.25; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: none; }
/* the lighting engine's output sits exactly over the map canvas, inside its frame; taps go through to the map */
#glv { position: absolute; left: 3px; top: 3px; width: calc(100% - 6px); height: calc(100% - 6px); pointer-events: none; border-radius: 1px; image-rendering: pixelated; }
.mapbtn { position: absolute; left: 8px; bottom: 8px; width: 38px; height: 38px; min-height: 38px; padding: 0; display: grid; place-items: center; background: rgba(22, 26, 42, .78); border-color: rgba(236, 230, 216, .25); }
#bFull { left: 54px; }
#bSet { left: 100px; }
.fpsmeter { position: absolute; right: 8px; bottom: 8px; padding: 2px 6px; background: rgba(14, 16, 30, .8); border: 2px solid #12152a; border-radius: 3px; font: 600 .75rem ui-monospace, monospace; color: var(--good); pointer-events: none; }
.mapwrap.scan::after { content: ''; position: absolute; inset: 3px; pointer-events: none; background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .2) 0 1px, transparent 1px 3px); mix-blend-mode: multiply; }
/* the settings panel: a sheet over the bottom of a phone, a panel at the side of a wide screen; the map stays in view */
.modal.sheetm { place-items: end center; padding: 0; background: rgba(10, 12, 22, .3); }
.modal.sheetm .box.wide { width: min(100%, 560px); max-height: 58vh; max-height: 58dvh; overflow-y: auto; border-radius: 3px 3px 0 0; padding: 12px 14px calc(14px + env(safe-area-inset-bottom, 0px)); animation: sheetup .22s steps(4, end); }
@media (min-width: 900px) { .modal.sheetm { place-items: center end; padding: 16px; } .modal.sheetm .box.wide { max-height: 92vh; max-height: 92dvh; border-radius: 3px; width: 460px; } }
@keyframes sheetup { from { transform: translateY(30px); opacity: 0; } }
.settabs { position: sticky; top: -12px; z-index: 1; background: var(--panel); padding: 4px 0 8px; }
.settabs button { flex: 1; }
.setbody { display: grid; gap: 2px; }
.setbody .row.setrow { padding: 8px 0; }
.setbody .row.setrow .seg { flex-wrap: wrap; }
.setbody small { display: block; line-height: 1.25; }
#bFull .back, body.mapfull #bFull .go { display: none; }
body.mapfull #bFull .back { display: block; }
/* full-screen map: the stage covers the page, the map fills the height, controls stay underneath, cards float over the map */
body.mapfull .stage { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px;
  padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
body.mapfull .mapwrap { width: min(100%, calc((100vh - 84px) * 12 / 14)); width: min(100%, calc((100dvh - 84px) * 12 / 14)); align-self: center; }
body.mapfull .stock { display: none; }
@media (orientation: portrait) { body.mapfull .mapwrap { align-self: start; } }
body.mapfull .controls { width: 100%; max-width: 760px; margin: 0 auto; }
body.mapfull #card:not([hidden]) { position: fixed; z-index: 50; left: 0; right: 0; margin: 0 auto; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: min(94vw, 460px); max-height: 48vh; max-height: 48dvh; overflow-y: auto; }
.mapbtn .ic { width: 12px; height: 14px; display: block; background: linear-gradient(90deg, currentColor 0 34%, transparent 34% 66%, currentColor 66%); }
.pausecover { position: absolute; inset: 0; border-radius: 2px; border: 0; box-shadow: none; background: rgba(14, 16, 30, .62); display: grid; place-content: center; gap: 6px; text-align: center; animation: fadein .2s ease-out; }
.pausecover:hover:not(:disabled) { border-color: transparent; }
.pausecover:focus-visible { outline-offset: -4px; }
.pausecover b { font-family: var(--display); font-weight: 400; font-size: 2.2rem; color: var(--copper); }
.pausecover span { color: var(--fg); font-weight: 600; }
.pausecover b::before { content: ''; display: block; width: 0; height: 0; margin: 0 auto 10px; border-style: solid; border-width: 18px 0 18px 30px; border-color: transparent transparent transparent var(--copper); }
.controls { display: flex; gap: 6px; align-items: stretch; position: relative; }
.speedmenu { position: absolute; right: 0; bottom: calc(100% + 6px); z-index: 20; display: grid; gap: 4px; padding: 6px; background: var(--panel); border: 2px solid var(--copper); border-radius: 3px; box-shadow: 4px 4px 0 rgba(0, 0, 0, .45); animation: popin .16s steps(3, end); }
.speedmenu button { min-width: 84px; }
.setrow .seg { margin-left: auto; justify-content: flex-end; }
.controls #bWave { flex: 1; min-width: 0; min-height: 44px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.controls #bSpeed { width: 48px; padding: 0; }
#bWave { --p: 0%; font-size: 1.05rem; background-image: linear-gradient(90deg, rgba(255, 255, 255, .2) var(--p), transparent var(--p)); }
#bWave.soon { animation: soon 1s steps(2, jump-none) infinite; }
@keyframes soon { 50% { border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 1px; } }
#bWave.live { background-color: #5b2c2c; border-color: var(--bad); color: var(--fg); }
#bWave.live:disabled { opacity: 1; }
#bWave.held { background-color: var(--panel-2); border-color: var(--copper); color: var(--copper); }
#bHold { width: 48px; padding: 0; display: grid; place-items: center; align-content: center; gap: 3px; font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
#bHold .ic { width: 12px; height: 14px; display: block; background: linear-gradient(90deg, currentColor 0 34%, transparent 34% 66%, currentColor 66%); }
#bHold.held { background: #3d3522; border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(242, 208, 74, .35); }
.ab { position: relative; width: 48px; min-height: 44px; padding: 0; display: grid; place-items: center; overflow: hidden; }
.ab img.px { width: 28px; height: 28px; }
.ab .cd { position: absolute; inset: 0; background: rgba(15, 18, 30, .72); transform-origin: bottom; transform: scaleY(0); }
.ab .cdn { position: absolute; font-size: .85rem; color: var(--fg); }
.ab.ready { border-color: var(--gold); box-shadow: inset 0 0 0 1px rgba(242, 208, 74, .35); }
.ab.active { background: #4a3f22; }
.stock { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }

.chip img.px { width: 24px; height: 24px; }
.chip .v { font-weight: 700; line-height: 1.1; }
.chip .r { font-size: .7rem; color: var(--muted); line-height: 1.1; white-space: nowrap; }
.chip .r.up { color: var(--good); } .chip .r.down { color: var(--bad); }
.sheet { grid-area: sheet; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: grid; gap: 8px; align-content: start; padding-bottom: 8px; }
nav.tabs { grid-area: nav; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-bottom: 6px; }
nav.tabs button { position: relative; display: grid; justify-items: center; align-content: center; gap: 1px; padding: 4px 2px; min-height: 52px; font-size: .78rem; }

nav .dot { position: absolute; top: 5px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 2px var(--bg); }
@media (min-width: 900px) {
  body { padding-bottom: 12px; }
  .app { grid-template-columns: minmax(0, 1fr) 460px; grid-template-rows: auto auto minmax(0, 1fr); grid-template-areas: "head head" "stage nav" "stage sheet"; column-gap: 14px; padding-top: 12px; }
  h1 { font-size: 1.6rem; }
  .hud { gap: 16px; } .hud .lbl { display: inline; } .hud img.px { width: 20px; height: 20px; }
  .mapwrap { width: min(100%, calc((100vh - 170px) * 12 / 14)); width: min(100%, calc((100dvh - 170px) * 12 / 14)); }
  .stock { flex-wrap: wrap; }
  nav.tabs { padding-bottom: 0; }
  nav.tabs button { grid-auto-flow: column; gap: 6px; min-height: 42px; font-size: .95rem; }
  nav.tabs img.px { width: 20px; height: 20px; }
  nav .dot { top: -4px; right: -4px; }
}
button {

  /* a hard pixel bevel: light top-left edge, dark bottom-right edge; pressing flips it */
  box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .07), inset -2px -2px 0 rgba(0, 0, 0, .3);
  border: 2px solid #12152a; border-radius: 3px; padding: 7px 10px; cursor: pointer; min-height: 40px;
}

button:hover:not(:disabled) { border-color: var(--copper); }

const MS = l => (l >= 10) + (l >= 25) + (l >= 50) + (l >= 100 ? Math.floor(l / 100) : 0);
const nextMs = l => l < 10 ? 10 : l < 25 ? 25 : l < 50 ? 50 : (Math.floor(l / 100) + 1) * 100;
const blv = id => S[BY_ID[id].kind][id] || 0;
const bMult = id => Math.pow(2, MS(blv(id)));
const bCost = (b, have) => Math.ceil(b.def.cost * Math.pow(b.g, have));

function outRate(k) {

  for (const s of SHOPS) if (s.out === k) r += blv(s.id) * s.rate * craftMult() * bMult(s.id);
  return r;
}
const depth = k => 60 + 120 * outRate(k);
const price = k => ITEMS[k].p * sellMult() * dem(k);

  n = Math.min(n, S.res[k]); if (!(n > 0)) return 0;
  const v = sellValue(k, n); S.demand[k] = Math.max(.3, dem(k) * Math.exp(-n / depth(k)));
  S.res[k] -= n; earn(v); S.stats.sold += n; S.stats.soldV += v; return v;
}

const ACT = {}, STARVE = {}, PHASE = {};
function econStep(dt) {
  const ot = S.ot > 0 ? 3 : 1, pm = prodMult() * ot, cm = craftMult() * ot, ease = Math.min(1, dt * 3);
  S.ot = Math.max(0, S.ot - dt); for (const k in S.cd) S.cd[k] = Math.max(0, S.cd[k] - dt);
  for (const e of EXT) { const l = S.ext[e.id] || 0; if (l) add(e.out, l * e.rate * pm * bMult(e.id) * dt); }
  for (const s of SHOPS) {
    const l = S.shops[s.id] || 0; if (!l) continue;
    const cap = l * s.rate * cm * bMult(s.id) * dt; let n = S.off[s.id] ? 0 : cap, miss = null;
    for (const k in s.in) { const m = S.res[k] / s.in[k]; if (m < n) { n = m; miss = k; } }
    if (n > 0) { for (const k in s.in) S.res[k] -= n * s.in[k]; add(s.out, n); S.stats.made += n; PHASE[s.id] = ((PHASE[s.id] || 0) + n / l / bMult(s.id)) % 1; }
    ACT[s.id] = (ACT[s.id] || 0) + (n / cap - (ACT[s.id] || 0)) * ease; STARVE[s.id] = miss;
  }

  if (lv('ledger')) for (const k in ITEMS) if (S.auto[k] && S.res[k] > KEEP && dem(k) >= S.sellAbove) sell(k, S.res[k] - KEEP);

function econ(dt) { while (dt > 0) { const s = Math.min(dt, 5); econStep(s); dt -= s; } }

/* Steady income: coins per second this town makes once production settles, if surplus goods are sold at full price.
   Workshops are limited by their inputs, taken upstream first (SHOPS is listed in chain order), so a workshop short of
   inputs adds nothing and the camp that would feed it shows its real worth. extraId counts one more level of that
   building, which is how foremen value an upgrade. mode 'top' sells only goods no built workshop uses. */

  for (const e of EXT) { const l = lvl(e.id); if (l) have[e.out] += l * e.rate * pm * Math.pow(2, MS(l)); }
  for (const s of SHOPS) {
    const l = lvl(s.id); if (!l || S.off[s.id]) continue;
    let n = l * s.rate * cm * Math.pow(2, MS(l)); for (const k in s.in) { used[k] = 1; n = Math.min(n, have[k] / s.in[k]); }

/* Foremen. They are paid a share of what you earn (Works tab: 25, 50, 75 or 100 percent), saved in a purse, and never

  // (anything costing more than the purse can ever hold, about 10 minutes of income, is left for you)

async function checkUpdates(manual) {
